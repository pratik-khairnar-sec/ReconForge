<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="rfStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="rfGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="rfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="14" fill="url(#rfBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#rfStroke)" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Tactical Reticle Corner Accents -->
  <path d="M7 15 V10 H12" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M57 15 V10 H52" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M7 49 V54 H12" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M57 49 V54 H52" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Central Shield Surface with Glow -->
  <path d="M32 11 L48 18 V33 C48 43.5 41 50.5 32 54 C23 50.5 16 43.5 16 33 V18 Z" 
        fill="url(#rfGlow)" 
        stroke="url(#rfStroke)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#rfShadow)"/>

  <!-- Radar Scope Reticle -->
  <circle cx="32" cy="31" r="9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2.5 2" opacity="0.75"/>
  <line x1="32" y1="19" x2="32" y2="43" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="20" y1="31" x2="44" y2="31" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Center Forged Cyber Core -->
  <circle cx="32" cy="31" r="3.2" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.8"/>
  <circle cx="32" cy="31" r="1.2" fill="#0369a1"/>
</svg>